name: sa-hall

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sa_hall
      POSTGRES_USER: sa_hall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa_hall -d sa_hall"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      # PostgreSQL 18+ stores clusters under a version-specific subdirectory.
      # Mount the parent so the official entrypoint can use /18/docker safely.
      - postgres-data:/var/lib/postgresql
    networks:
      - backend

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: sa_hall
      DATABASE_USER: sa_hall
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - uploads-data:/app/data/uploads
    networks:
      - backend

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/web-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /var/run:size=8m,noexec,nosuid
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  uploads-data:
