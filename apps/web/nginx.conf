# This file is included inside nginx's http {} block.

# Per-client limits for the API. Behind a CDN or TLS proxy, configure
# set_real_ip_from/real_ip_header so $binary_remote_addr is the visitor, not the proxy.
limit_req_zone $binary_remote_addr zone=sh_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=sh_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Micro-cache for public API reads. Only responses that explicitly send public
# caching headers are stored; requests carrying credentials always bypass it.
# It lives under /tmp: the unprivileged image keeps all writable state there, and
# a root-owned tmpfs mounted over /var/cache/nginx is not writable by uid 101.
proxy_cache_path /tmp/nginx-api-cache levels=1:2 keys_zone=sh_api_cache:10m max_size=16m
                 inactive=10m use_temp_path=off;

upstream sh_api {
  server api:3000;
  keepalive 32;
}

# Cache policy by path. Fingerprinted bundles and fonts never change; HTML, the
# service worker and its manifest must always revalidate. Empty values add no header,
# leaving API responses to declare their own caching.
map $uri $sh_cache_control {
  default "no-cache";
  "~^/(?:main|chunk|polyfills|styles)-[A-Za-z0-9_-]{8}\.(?:js|css)$" "public, max-age=31536000, immutable";
  "~^/media/" "public, max-age=31536000, immutable";
  "~^/(?:images|icons)/" "public, max-age=604800, stale-while-revalidate=86400";
  "/favicon.ico" "public, max-age=604800";
  "~^/api/" "";
  "~^/health/" "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 15s;

  sendfile on;
  tcp_nopush on;
  open_file_cache max=2000 inactive=60s;
  open_file_cache_valid 120s;
  open_file_cache_errors on;

  # Static assets are pre-compressed at image build time; dynamic responses are
  # compressed on the fly at a CPU-friendly level.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json image/svg+xml
             text/css text/plain;

  # Headers are declared once at server level. Do not use add_header inside a
  # location block: nginx would then silently drop every header below for it.
  add_header Cache-Control $sh_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'" always;

  location = /web-health {
    access_log off;
    return 204;
  }

  # ^~ stops regex locations (static files below) from capturing API paths like *.json.
  location ^~ /api/ {
    limit_req zone=sh_api burst=40 nodelay;
    limit_conn sh_conn 20;

    proxy_pass http://sh_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_cache sh_api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_bypass $http_authorization $http_cookie;
    proxy_no_cache $http_authorization $http_cookie;
    # Collapse concurrent misses into one upstream request and keep serving the
    # previous copy while it refreshes or if the API is briefly unavailable.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  }

  location ^~ /health/ {
    access_log off;
    proxy_pass http://sh_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }

  # Missing files must be real 404s, never the SPA shell, so stale chunk or
  # service-worker requests fail cleanly instead of executing HTML.
  location ~* \.(?:js|css|map|json|webmanifest|ico|png|jpg|jpeg|webp|avif|svg|woff2|txt)$ {
    try_files $uri =404;
  }

  # Hidden files are never served, except the standard /.well-known/ directory.
  location ~ /\.(?!well-known/) {
    deny all;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
